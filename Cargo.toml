[workspace]
resolver = "2"
members = [
    "crates/json-constraint",
    "crates/zarr-collection",
    "crates/constraint-views",
    "python/datacollections-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/earth-mover/datacollections"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is not optional for this project: without it serde_json's parser
# is allowed to be a ULP out, which breaks the round-trip law on real data — a float
# attribute read back from a store came out one bit different from the value written.
# `preserve_order` keeps object key order stable through parse/serialise.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
json-constraint = { path = "crates/json-constraint" }
zarr-collection = { path = "crates/zarr-collection" }
constraint-views = { path = "crates/constraint-views" }
