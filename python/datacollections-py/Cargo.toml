[package]
name = "datacollections-py"
description = "Python bindings for the DataCollections constraint algebra, store layout and views."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_datacollections"
crate-type = ["cdylib", "rlib"]

[dependencies]
json-constraint = { workspace = true }
zarr-collection = { workspace = true }
constraint-views = { workspace = true }
serde_json = { workspace = true }
pyo3 = { version = "0.29" }

[features]
# Enabled by maturin (see pyproject.toml). Left off by default so `cargo test` can
# link the crate against a normal libpython instead of an extension module.
extension-module = ["pyo3/extension-module"]
